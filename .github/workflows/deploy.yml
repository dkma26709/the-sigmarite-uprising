name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile scenarios and army sheets to PDF
        shell: bash
        run: |
          mkdir -p pdfs
          shopt -s nullglob
          compile() {
            echo "Compiling $1"
            typst compile --root . "$1" "pdfs/$2.pdf"
            typst compile --root . --input print=true "$1" "pdfs/$2-print.pdf"
          }
          for src in scenarios/*.typ; do
            name="$(basename "$src" .typ)"
            [ "$name" = "template" ] && continue
            compile "$src" "$name"
          done
          for src in factions/*/army.typ; do
            compile "$src" "$(basename "$(dirname "$src")")-army"
          done

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.json app.webmanifest _site/
          cp -r pdfs _site/
          cp -r factions _site/
          cp "Campaign Reference.md" _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
